[package]
name = "coordinator"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "coordinator"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "0.31.1"
verifier_router = { git = "https://github.com/boundless-xyz/risc0-solana", tag = "v3.0.0", package = "verifier_router", features = [
    "cpi",
] }
groth_16_verifier = { git = "https://github.com/boundless-xyz/risc0-solana", tag = "v3.0.0", package = "groth_16_verifier" }

[dev-dependencies]
litesvm = "0.10.0"
borsh = "0.10.3"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
verifier_router = { git = "https://github.com/boundless-xyz/risc0-solana", tag = "v3.0.0", package = "verifier_router", features = [
    "cpi",
] }
groth_16_verifier = { git = "https://github.com/boundless-xyz/risc0-solana", tag = "v3.0.0", package = "groth_16_verifier" }
solana-account = "3"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }
